            <h2>Contacto</h2>
            <form action="#" method="post">
                <fieldset style="border: 1px solid #ffffff; padding: 15px; border-radius: 8px;">
                    <legend style="color: #ffffff; font-weight: bold;">Envíame un mensaje</legend>

                    <p>
                        <label>Nombre:</label><br>
                        <input type="text" name="nombre" style="width: 100%; color: #000;" required>
                    </p>

                    <p>
                        <label>Correo Electrónico:</label><br>
                        <input type="email" name="correo" style="width: 100%; color: #000;" required>
                    </p>

                    <p>
                        <label>Mensaje:</label><br>
                        <textarea name="mensaje" rows="4" style="width: 100%; color: #000;" required></textarea>
                    </p>

                    <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Enviar</button>
                </fieldset>
            </form>
